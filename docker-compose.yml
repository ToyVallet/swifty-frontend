version: '3.8'

services:
  user-web:
    build:
      context: .
      dockerfile: ./apps/user-web/Dockerfile
    network_mode: 'host'
    environment:
      NODE_ENV: production
      PORT: 3000
    command: ['node', 'apps/user-web/server.js']
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  root-admin:
    build:
      context: .
      dockerfile: ./apps/root-admin/Dockerfile
    network_mode: 'host'
    environment:
      NODE_ENV: production
      PORT: 3001
    command: ['node', 'apps/root-admin/server.js']
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  using-ticket:
